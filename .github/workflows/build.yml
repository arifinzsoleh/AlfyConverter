name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ekstrak ZIP (jika repo berisi zip) & cari root proyek
        id: proj
        run: |
          echo "== Isi repo =="; find . -not -path './.git/*' -not -path './.git' | head -50
          z=""; best=0
          while IFS= read -r f; do
            t=$(git log -1 --format=%ct -- "$f"); echo "zip: $f ($t)"
            if [ "${t:-0}" -ge "$best" ]; then best=${t:-0}; z="$f"; fi
          done < <(find . -iname '*.zip' -not -path './.git/*')
          echo "Dipakai: $z"
          if [ -n "$z" ]; then
            rm -rf temp_project && mkdir temp_project && unzip -q "$z" -d temp_project
            root=temp_project
          else
            root=.
          fi
          f=$(find "$root" -name settings.gradle.kts -not -path './.git/*' | head -n1)
          [ -z "$f" ] && { echo "settings.gradle.kts tidak ditemukan"; exit 1; }
          d=$(dirname "$f")
          echo "== Root proyek: $d =="; cat "$f"; ls -la "$d" "$d/app" || true
          [ -f "$d/app/build.gradle.kts" ] || { echo "app/build.gradle.kts tidak ada di $d"; exit 1; }
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Daftar project Gradle
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle projects --no-daemon

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Siapkan APK
        run: |
          apk=$(find "${{ steps.proj.outputs.dir }}" -path '*outputs/apk/debug/*.apk' | head -n1)
          cp "$apk" AlfyConverter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlfyConverter-apk
          path: AlfyConverter.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" AlfyConverter.apk --title "AlfyConverter $tag" --notes "Auto build #${{ github.run_number }}"
