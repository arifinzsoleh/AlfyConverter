name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP
        run: |
          # Cari file ZIP
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then echo "ZIP tidak ditemukan!"; exit 1; fi
          echo "Menggunakan ZIP: $ZIP"
          
          mkdir -p ./temp_project
          unzip -q "$ZIP" -d ./temp_project
          
          # Antisipasi kalau Claude naro ZIP di dalam ZIP
          find ./temp_project -maxdepth 3 -name "*.zip" -exec unzip -q -o {} -d ./temp_project \;
          
          # Cari folder project yang bener (tempat settings.gradle berada)
          SETTINGS=$(find ./temp_project -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle tidak ditemukan!"; exit 1; fi
          PROJ_DIR=$(dirname "$SETTINGS")
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV
          echo "Root project ketemu di: $PROJ_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build APK
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find ${{ env.PROJ_DIR }} -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then echo "APK gagal dibuat."; exit 1; fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "AlfyConverter Build ${{ github.run_number }}"
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
