name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then echo "ZIP tidak ditemukan!"; exit 1; fi
          mkdir -p ./temp_project
          unzip -q "$ZIP" -d ./temp_project
          find ./temp_project -maxdepth 3 -name "*.zip" -exec unzip -q -o {} -d ./temp_project \;
          
          PROJ_DIR=$(find ./temp_project -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJ_DIR" ]; then PROJ_DIR="./temp_project"; fi
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build APK
        run: |
          cd ${{ env.PROJ_DIR }}
          
          # Cari folder yang punya tulisan com.android.application (folder app asli)
          APP_GRADLE=$(grep -rl "com.android.application" --include="build.gradle*" . | head -n 1)
          if [ -n "$APP_GRADLE" ]; then
            APP_DIR=$(dirname "$APP_GRADLE")
            cd "$APP_DIR"
            echo "Masuk ke folder aplikasi: $APP_DIR"
          fi
          
          if [ -f gradlew ]; then chmod +x gradlew; fi
          gradle assembleDebug

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find ${{ env.PROJ_DIR }} -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then echo "APK gagal dibuat."; exit 1; fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "AlfyConverter Build ${{ github.run_number }}"
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
